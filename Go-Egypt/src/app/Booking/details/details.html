<main class="bg-light py-5">
  <app-stepper [currentStep]="2"></app-stepper>

  <div class="d-flex justify-content-center my-4" *ngIf="selectedPackage">
    <div class="card shadow h-100" style="max-width: 900px">
      <div class="row g-0">
        <div class="col-md-4">
          <img [src]="selectedPackage.img" class="img-fluid rounded-start h-100 object-fit-cover" [alt]="selectedPackage.name">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ selectedPackage.name }}</h5>
            <div class="d-flex align-items-center text-secondary mb-2">
              <i class="bi bi-geo-alt me-2"></i>
              <span class="fw-bold">{{ selectedPackage.location }}</span>
            </div>
            <p class="card-text text-secondary py-2 fs-6">{{ selectedPackage.desc }}</p>
            <p class="card-text price-book fw-bold fs-5">${{ selectedPackage.pricePerAdult }} / adult</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container" style="max-width: 900px;">
    <div class="card shadow p-4">
      <form (ngSubmit)="completeBooking()" #bookingForm="ngForm">
        <p class="fs-5 fw-bold">Traveler Information</p>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" [(ngModel)]="traveler.firstName" name="firstName" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" [(ngModel)]="traveler.lastName" name="lastName" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" [(ngModel)]="traveler.phone" name="phone" required />
          </div>
        </div>

        <p class="fs-5 fw-bold mt-4">Trip Details</p>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" [(ngModel)]="traveler.startDate" name="startDate" (change)="onDateChange()" required />
          </div>

          <div class="col-md-4">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" [(ngModel)]="traveler.endDate" name="endDate" />
          </div>

          <div class="col-md-4" *ngIf="availableTimes.length > 0">
            <label class="form-label">Available Times</label>
            <select class="form-select" name="startTime">
              <option *ngFor="let time of availableTimes" [value]="time">{{ time }}</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Adults</label>
            <select class="form-select" [(ngModel)]="traveler.adults" name="adults" required>
              <option *ngFor="let n of [1,2,3,4,5]" [value]="n">{{ n }}</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Children</label>
            <select class="form-select" [(ngModel)]="traveler.children" name="children">
              <option *ngFor="let n of [0,1,2,3,4,5]" [value]="n">{{ n }}</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Special Requests</label>
            <input type="text" class="form-control" [(ngModel)]="traveler.specialRequests" name="specialRequests" placeholder="Optional" />
          </div>
        </div>

        <div class="bg-light border rounded p-3 mt-4 d-flex justify-content-between align-items-center">
          <div>
            <p class="mb-1 text-secondary">Estimated total</p>
            <p class="mb-0 fw-bold fs-5">${{ quotedPrice }}</p>
          </div>
          <span class="badge bg-warning text-dark">Server-validated on payment</span>
        </div>

        <div class="alert alert-danger mt-3" role="alert" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-secondary btn-lg w-25" (click)="back()">Back to Packages</button>
          <button type="submit" class="btn button-book btn-lg w-25 text-white" [disabled]="!bookingForm.form.valid || isSubmitting">
            {{ isSubmitting ? 'Submitting...' : 'Confirm Booking' }}
          </button>
        </div>
      </form>      
    </div>
  </div>
</main>
