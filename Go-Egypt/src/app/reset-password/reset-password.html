<section class="d-flex align-items-center justify-content-center px-3 py-3"
        style="min-height:100vh; background: linear-gradient(to bottom, #fbf6ef 0%, #f3eede 100%);">
    <div class="w-100 mx-auto d-flex flex-column mt-5" style="max-width:30rem;">

        <!-- Card -->
        <div class="bg-white rounded-3 shadow-sm border justify-content-center forgot-card">

            <!-- Circle Icon -->
            <div class="d-flex align-items-center justify-content-center rounded-circle mx-auto mb-4 icon-circle">
                <i class="bi bi-lock fs-2 fw-bold icon-color"></i>
            </div>

            <!-- Title & Description -->
            <div class="text-center mb-3">
                <h2 class="fw-bold text-dark mb-2" style="font-size:30px;">Set a New Password</h2>
                <p class="text-secondary mb-0">Please enter your new password below.</p>
            </div>

            <!-- Form -->
            <form class="mt-4" novalidate>
              <!--new password-->
                <label for="email" class="form-label small fw-semibold text-dark mb-2">New Password</label>
                <div class="position-relative mb-3">
                    <i class="bi bi-lock input-icon"></i>
                    <div class="position-relative">
                      <input 
                        [type]="showPassword ? 'text' : 'password';"
                        id="newPassword"
                        class="ps-5 py-3 rounded-3 input-shadow" style="width: 100%;"
                        placeholder="Enter password"
                      />
                      <!--icon-->
                      <button 
                        type="button"
                        class="position-absolute end-0 me-3 top-50 translate-middle-y text-secondary-emphasis bg-transparent border-0 p-0"
                        (click)="togglePassword()">
                        <i [class]="showPassword ? 'bi bi-eye-slash fs-5' : 'bi bi-eye fs-5'"></i>
                      </button>
                    </div>
                </div>
                <!--confirm password-->
                <label for="email" class="form-label small fw-semibold text-dark mb-2">Confirm Password</label>
                <div class="position-relative mb-4">
                    <i class="bi bi-lock input-icon"></i>
                    <div class="position-relative">
                      <input 
                        [type]="showPassword ? 'text' : 'password'"
                        id="confirmPassword"
                        class="ps-5 py-3 rounded-3 input-shadow" style="width: 100%;"
                        placeholder="Enter password"
                      />
                      <!--icon-->
                      <button 
                        type="button"
                        class="position-absolute end-0 me-3 top-50 translate-middle-y text-secondary-emphasis bg-transparent border-0 p-0"
                        (click)="togglePassword()">
                        <i [class]="showPassword ? 'bi bi-eye-slash fs-5' : 'bi bi-eye fs-5'"></i>
                      </button>
                    </div>

                </div>

                <!--password requirements-->
                <div class="bg-light rounded-3 p-3 ">
                  <p class="fs-6 fw-medium text-dark mb-2">Password must contain:</p>
                  <ul class="mb-0 ps-6">
                    <li class="text-secondary mb-1">At least 8 characters</li>
                    <li class="text-secondary mb-1">Both uppercase and lowercase letters</li>
                    <li class="text-secondary mb-1">At least one number</li>
                    <li class="text-secondary mb-1">At least one special character</li>
                  </ul>
                </div>

                <a routerLink="/reset-success" type="submit" class="btn btn-orange w-100 rounded-3 py-2 mb-3 mt-4">Reset Password</a>
                <a routerLink="/login" class="btn btn-link w-100 rounded-3 py-2" style="color: #E08D00;">Back to Login</a>
            </form>

        </div>

    </div>
</section>
