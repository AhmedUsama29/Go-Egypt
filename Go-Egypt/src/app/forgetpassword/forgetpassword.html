<section class="d-flex align-items-center justify-content-center px-3 py-3"
        style="min-height:100vh; background: linear-gradient(to bottom, #fbf6ef 0%, #f3eede 100%);">
    <div class="w-100 mx-auto d-flex flex-column " style="max-width:30rem;">

        <!-- Back to Sign In -->
        <a routerLink="/login" class="d-inline-flex mb-4 text-decoration-none" style="color: #D97706;">
            <i class="bi bi-arrow-left fs-6"></i>
            <span class="back fs-6 ms-2">Back to Sign In</span>
        </a>

        <!-- Card -->
        <div class="bg-white rounded-3 shadow-sm border justify-content-center forgot-card">

            <!-- Circle Icon -->
            <div class="d-flex align-items-center justify-content-center rounded-circle mx-auto mb-4 icon-circle">
                <i class="bi bi-envelope fs-3 icon-color"></i>
            </div>

            <!-- Title & Description -->
            <div class="text-center mb-3">
                <h2 class="fw-bold text-dark mb-2" style="font-size:30px;">Forgot Password?</h2>
                <p class="text-secondary mb-0">No worries! Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <!-- Form -->
            <form class="mt-4" novalidate>
                <label for="email" class="form-label small fw-semibold text-dark mb-2">Email Address</label>
                <div class="position-relative mb-3">
                    <i class="bi bi-envelope input-icon"></i>
                    <input id="email" type="email" class="ps-5 py-3 rounded-3 input-shadow" style="width: 100%;"
                        placeholder="your.email@example.com" required>
                </div>

                <a routerLink="/resendemail" type="submit" class="btn btn-orange w-100 rounded-3 py-2 mb-3">Send Reset Link</a>
            </form>

            <div class="divider my-3">
                <span class="divider-line"></span>
                <span class="divider-text">or</span>
                <span class="divider-line"></span>
            </div>

            <div class="text-center">
                <p class="mb-0">Don't have an account?
                    <a routerLink="/sign-up" class="signup" style="color:#D97706;">Sign Up</a>
                </p>
            </div>

        </div>

        <div class="text-center mt-4 small text-secondary">
            Need help? <a routerLink="/contact-us" class="support" style="color:#D97706; text-decoration: none;">Contact Support</a>
        </div>

    </div>
</section>
